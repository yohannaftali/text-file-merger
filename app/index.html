<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; media-src 'self' file:"/>
    <title>Text Files Merger</title>
    <link href="font/MaterialIcons/material-icons.css" rel="stylesheet" type="text/css"/>
    <link href="css/style.css" rel="stylesheet" type="text/css"/>
</head>
<body>
<header class="titlebar">
    <div class="titlebar-title"><i class="material-icons">merge_type</i>Text Files Merger</div>
    <div class="titlebar-actions">
        <button id="settings" class="icon-btn" type="button" title="Settings"><i class="material-icons">settings</i></button>
        <button id="close" class="icon-btn close" type="button" title="Close"><i class="material-icons">close</i></button>
    </div>
</header>
<main class="content">
    <section class="card">
        <h1 class="card-title">Merge files</h1>
        <p id="instruction" class="muted"></p>
        <p class="warning"><i class="material-icons">warning</i>An existing result file in the folder will be overwritten.</p>
        <button id="select-btn" class="btn" type="button"><i class="material-icons">folder_open</i>Select Folder…</button>
    </section>
    <section id="result" class="card" hidden>
        <dl class="details">
            <div class="detail-row"><dt>Folder</dt><dd id="folder-info"></dd></div>
            <div class="detail-row"><dt>Extension</dt><dd id="ext-info"></dd></div>
            <div class="detail-row"><dt>Result file</dt><dd id="result-info"></dd></div>
        </dl>
        <p id="files-message" class="status"></p>
    </section>
</main>
<script src="js/index.js"></script>
</body>
</html>
