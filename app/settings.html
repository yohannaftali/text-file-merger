<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'"/>
    <title>Settings</title>
    <link href="font/MaterialIcons/material-icons.css" rel="stylesheet" type="text/css"/>
    <link href="css/style.css" rel="stylesheet" type="text/css"/>
</head>
<body>
<header class="titlebar">
    <div class="titlebar-title"><i class="material-icons">settings</i>Settings</div>
    <div class="titlebar-actions">
        <button id="close" class="icon-btn close" type="button" title="Close"><i class="material-icons">close</i></button>
    </div>
</header>
<main class="content">
    <section class="card">
        <h1 class="card-title">File extension</h1>
        <p class="muted">Only files with this extension are merged.</p>
        <fieldset class="segmented">
            <label><input name="fileext" type="radio" class="file-extention-radio" file-ext="txt"/><span>txt</span></label>
            <label><input name="fileext" type="radio" class="file-extention-radio" file-ext="csv"/><span>csv</span></label>
            <label><input name="fileext" type="radio" class="file-extention-radio" file-ext="tsv"/><span>tsv</span></label>
        </fieldset>
    </section>
</main>
<script src="js/settings.js"></script>
</body>
</html>
