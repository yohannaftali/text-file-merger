name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win32
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Package app
        shell: bash
        run: npx @electron/packager . text-file-merger --platform=${{ matrix.platform }} --arch=x64 --out=dist --overwrite --ignore="^.(build|dist|\.github|\.gitignore)"

      - name: Zip package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/text-file-merger-win32-x64 -DestinationPath text-file-merger-win32-x64.zip

      - name: Zip package (Linux/macOS)
        if: runner.os != 'Windows'
        run: cd dist && zip -r -y ../text-file-merger-${{ matrix.platform }}-x64.zip text-file-merger-${{ matrix.platform }}-x64

      - uses: actions/upload-artifact@v4
        with:
          name: text-file-merger-${{ matrix.platform }}-x64
          path: text-file-merger-${{ matrix.platform }}-x64.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
